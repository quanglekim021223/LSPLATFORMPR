stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "5"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "pip-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

build-function-dev:
  stage: build

  tags:
    - vm-az-gitlab

  image: python:3.11-slim
  timeout: 30m

  before_script:
    - test -n "$AZURE_FIREWALL_CA"
    - printf '%s\n' "$AZURE_FIREWALL_CA" > "$CI_PROJECT_DIR/firewall-ca.crt"
    - grep -q "BEGIN CERTIFICATE" "$CI_PROJECT_DIR/firewall-ca.crt"
    - cp /etc/ssl/certs/ca-certificates.crt "$CI_PROJECT_DIR/custom-ca.crt"
    - cat "$CI_PROJECT_DIR/firewall-ca.crt" >> "$CI_PROJECT_DIR/custom-ca.crt"
    - export SSL_CERT_FILE="$CI_PROJECT_DIR/custom-ca.crt"
    - export REQUESTS_CA_BUNDLE="$CI_PROJECT_DIR/custom-ca.crt"
    - export PIP_CERT="$CI_PROJECT_DIR/custom-ca.crt"

  script:
    - rm -rf "$CI_PROJECT_DIR/.function-build"
    - rm -f "$CI_PROJECT_DIR/functionapp.zip"
    - mkdir -p "$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages"
    - cd "$CI_PROJECT_DIR/backend"

    - |
      for attempt in 1 2 3; do
        if python -m pip install \
          --timeout 120 \
          --retries 5 \
          --target "$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages" \
          -r requirements.txt; then
          break
        fi

        if [ "$attempt" -eq 3 ]; then
          echo "pip install failed after 3 attempts"
          exit 1
        fi

        echo "pip install failed; retrying in 10 seconds"
        sleep 10
      done

    - cp function_app.py host.json requirements.txt pyproject.toml "$CI_PROJECT_DIR/.function-build/"

    - |
      PYTHONPATH="$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages" \
        python -c "
      import app
      import azure.functions
      print('Function dependencies verified')
      "

    - cd "$CI_PROJECT_DIR/.function-build"
    - python -m zipfile -c "$CI_PROJECT_DIR/functionapp.zip" .

    - |
      python -c "
      import zipfile

      with zipfile.ZipFile('$CI_PROJECT_DIR/functionapp.zip') as archive:
          names = {name.lstrip('./') for name in archive.namelist()}

      required = {
          'host.json',
          'function_app.py',
          'requirements.txt',
      }

      missing = required - names
      assert not missing, f'Missing root files: {missing}'
      print('Deployment package verified')
      "

  artifacts:
    paths:
      - functionapp.zip
    expire_in: 1 day

  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

deploy-dev:
  stage: deploy

  tags:
    - vm-az-gitlab

  image: mcr.microsoft.com/azure-cli:latest
  timeout: 30m
  resource_group: fsa-function-app-dev

  needs:
    - job: build-function-dev
      artifacts: true

  before_script:
    - test -n "$AZURE_FIREWALL_CA"
    - printf '%s\n' "$AZURE_FIREWALL_CA" > "$CI_PROJECT_DIR/firewall-ca.crt"
    - grep -q "BEGIN CERTIFICATE" "$CI_PROJECT_DIR/firewall-ca.crt"
    - cp /etc/ssl/certs/ca-certificates.crt "$CI_PROJECT_DIR/custom-ca.crt"
    - cat "$CI_PROJECT_DIR/firewall-ca.crt" >> "$CI_PROJECT_DIR/custom-ca.crt"
    - export SSL_CERT_FILE="$CI_PROJECT_DIR/custom-ca.crt"
    - export REQUESTS_CA_BUNDLE="$CI_PROJECT_DIR/custom-ca.crt"

    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID" \
        --output none

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - test -f "$CI_PROJECT_DIR/functionapp.zip"

    - |
      az functionapp deployment source config-zip \
        --resource-group "$RESOURCE_GROUP" \
        --name "$FUNCTIONAPP_NAME" \
        --src "$CI_PROJECT_DIR/functionapp.zip" \
        --build-remote false

  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never