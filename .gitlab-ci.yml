stages:
  - build
  - deploy

workflow:
  rules:
    # Temporary: remove after Azure deployment is verified.
    - if: '$CI_COMMIT_BRANCH == "feature/fix_cicd"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DEFAULT_TIMEOUT: "600"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "pip-python-3.11"
  paths:
    - .cache/pip/

build-function-dev:
  stage: build

  tags:
    - vm-az-gitlab

  image: python:3.11-slim
  timeout: 30m

  before_script:
    - test -n "$AZURE_FIREWALL_CA"
    - printf '%s\n' "$AZURE_FIREWALL_CA" > "$CI_PROJECT_DIR/firewall-ca.crt"
    - grep -q "BEGIN CERTIFICATE" "$CI_PROJECT_DIR/firewall-ca.crt"
    - cp /etc/ssl/certs/ca-certificates.crt "$CI_PROJECT_DIR/custom-ca.crt"
    - cat "$CI_PROJECT_DIR/firewall-ca.crt" >> "$CI_PROJECT_DIR/custom-ca.crt"
    - export SSL_CERT_FILE="$CI_PROJECT_DIR/custom-ca.crt"
    - export REQUESTS_CA_BUNDLE="$CI_PROJECT_DIR/custom-ca.crt"
    - export PIP_CERT="$CI_PROJECT_DIR/custom-ca.crt"

  script:
    - rm -rf "$CI_PROJECT_DIR/.function-build"
    - rm -f "$CI_PROJECT_DIR/functionapp.zip"
    - mkdir -p "$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages"
    - cd "$CI_PROJECT_DIR/backend"

    # Temporary diagnostic: inspect the metadata response on the runner network.
    - |
      python -u - <<'PY'
      import hashlib
      import time
      import urllib.request
      from datetime import datetime, timezone

      print("Diagnostic started UTC:", datetime.now(timezone.utc).isoformat())
      # Exact metadata target from the failed pip download; no JSON lookup.
      url = (
          "https://files.pythonhosted.org/packages/49/9a/"
          "417b3a533e01953a7c618884df2cb05a71e7b68bdbce4fbdb62349d2a2e8/"
          "azure_identity-1.25.3-py3-none-any.whl.metadata"
      )
      expected = "9f5f4a1c9476d7c0e6c26dfd7a57de3a10b98d65bf018c509d96ce3b6921de54"

      print("URL:", url)
      started = time.monotonic()
      received = 0
      digest = hashlib.sha256()

      try:
          request = urllib.request.Request(
              url, headers={"Accept-Encoding": "identity"}
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              print("HTTP status:", response.status)
              for name in (
                  "Content-Length", "Content-Type", "Server",
                  "Via", "Age", "X-Cache"
              ):
                  print(f"{name}: {response.headers.get(name)}")

              while True:
                  chunk = response.read1(4096)
                  if not chunk:
                      break
                  received += len(chunk)
                  digest.update(chunk)
                  print("Progress bytes:", received)

      except Exception as error:
          print("Download error:", type(error).__name__, str(error))

      print("Elapsed seconds:", round(time.monotonic() - started, 1))
      print("Bytes received:", received)
      print("Expected SHA256:", expected)
      print("Received SHA256:", digest.hexdigest())
      print("Hash matches:", digest.hexdigest() == expected)
      PY

    # Temporary diagnostic: verify package downloads without using pip cache.
    - |
      python -m pip install \
        --dry-run \
        --ignore-installed \
        --no-cache-dir \
        --timeout 600 \
        --retries 10 \
        --verbose \
        "azure-identity==1.25.3"

    - |
      python -m pip install \
        --timeout "$PIP_DEFAULT_TIMEOUT" \
        --retries "$PIP_RETRIES" \
        --target "$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages" \
        -r requirements.txt

    - cp function_app.py host.json requirements.txt pyproject.toml "$CI_PROJECT_DIR/.function-build/"
    - cp -R src "$CI_PROJECT_DIR/.function-build/"
    - python -m compileall -q "$CI_PROJECT_DIR/.function-build/function_app.py" "$CI_PROJECT_DIR/.function-build/src"

    - |
      PYTHONPATH="$CI_PROJECT_DIR/.function-build/.python_packages/lib/site-packages" \
        python -c "
      import sys

      sys.path.insert(0, '$CI_PROJECT_DIR/.function-build')
      import function_app

      names = sorted(
          function.get_function_name()
          for function in function_app.app.get_functions()
      )
      expected = ['http_app_func', 'scheduled_vendor_ingestion']
      assert names == expected, f'Unexpected Azure Functions: {names}'
      print(f'Function entrypoint verified: {names}')
      "

    - |
      python -c "
      from pathlib import Path
      from zipfile import ZIP_DEFLATED, ZipFile

      root = Path('$CI_PROJECT_DIR/.function-build')
      output = Path('$CI_PROJECT_DIR/functionapp.zip')

      with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
          for path in root.rglob('*'):
              if path.is_file():
                  archive.write(path, path.relative_to(root).as_posix())

      print('Deployment package created')
      "

    - |
      python -c "
      import zipfile

      with zipfile.ZipFile('$CI_PROJECT_DIR/functionapp.zip') as archive:
          names = set(archive.namelist())

      required = {
          'host.json',
          'function_app.py',
          'requirements.txt',
      }

      missing = required - names
      assert not missing, f'Missing root files: {missing}'
      assert not any(name.startswith('./') for name in names), \
          'ZIP entries must not start with ./'
      assert any(
          name.startswith('.python_packages/lib/site-packages/azure/functions/')
          for name in names
      ), 'azure-functions dependency is missing from the deployment package'
      print('Deployment package verified')
      "

  artifacts:
    paths:
      - functionapp.zip
    expire_in: 1 day

deploy-dev:
  stage: deploy

  tags:
    - vm-az-gitlab

  image: mcr.microsoft.com/azure-cli:latest
  timeout: 30m
  resource_group: fsa-function-app-dev

  needs:
    - job: build-function-dev
      artifacts: true

  before_script:
    - test -n "$AZURE_FIREWALL_CA"
    - printf '%s\n' "$AZURE_FIREWALL_CA" > "$CI_PROJECT_DIR/firewall-ca.crt"
    - grep -q "BEGIN CERTIFICATE" "$CI_PROJECT_DIR/firewall-ca.crt"
    - cp /etc/ssl/certs/ca-certificates.crt "$CI_PROJECT_DIR/custom-ca.crt"
    - cat "$CI_PROJECT_DIR/firewall-ca.crt" >> "$CI_PROJECT_DIR/custom-ca.crt"
    - export SSL_CERT_FILE="$CI_PROJECT_DIR/custom-ca.crt"
    - export REQUESTS_CA_BUNDLE="$CI_PROJECT_DIR/custom-ca.crt"

    - |
      az login \
        --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID" \
        --output none

    - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - test -f "$CI_PROJECT_DIR/functionapp.zip"

    - |
      az functionapp deployment source config-zip \
        --resource-group "$RESOURCE_GROUP" \
        --name "$FUNCTIONAPP_NAME" \
        --src "$CI_PROJECT_DIR/functionapp.zip" \
        --build-remote false
