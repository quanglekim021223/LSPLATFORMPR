stages:
  - deploy

deploy-dev:
  stage: deploy

  tags:
    - vm-az-gitlab

  image: mcr.microsoft.com/azure-cli:latest  

  before_script:
      - echo "$AZURE_FIREWALL_CA" > firewall-ca.crt
      - cp /etc/ssl/certs/ca-certificates.crt custom-ca.crt
      - cat firewall-ca.crt >> custom-ca.crt
      - export SSL_CERT_FILE=$PWD/custom-ca.crt
      - export REQUESTS_CA_BUNDLE=$PWD/custom-ca.crt
      - export AZURE_CLI_DISABLE_CONNECTION_VERIFICATION=1
      - az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      - az account set --subscription "$AZURE_SUBSCRIPTION_ID"

  script:
    - cd backend
    - python3 -m zipfile -c functionapp.zip .
    - az functionapp deployment source config-zip --resource-group "$RESOURCE_GROUP" --name "$FUNCTIONAPP_NAME" --src functionapp.zip

